name: CI

# Pipeline from docs/PLAN.md "Testing and CI":
#   1. Lint GDScript + asset validation   2. Unit and statistical tests
#   3. Headless network test              4. Lobby tests + container build
#   5. Windows + Linux exports (uploaded as artifacts on every push)
#   6. GitHub Release with the Windows zip on `v*` tags
# Every job runs the same tools/*.py scripts as the local check (python tools/check.py).

on:
  push:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - run: gdlint game/scripts game/tests game/tools
      - run: gdformat --check game/scripts game/tests game/tools
      - name: Validate assets
        run: |
          python -m unittest discover -s tools -p "test_*.py"
          python tools/validate_assets.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Cache Godot
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .tools/godot
          key: godot-${{ runner.os }}-${{ hashFiles('.godot-version', 'tools/godot-*.sha512') }}
      - name: Run gdUnit4 tests
        run: python tools/run_tests.py
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gdunit4-report
          path: game/reports/
          if-no-files-found: ignore
      - name: Check generated asset resources are up to date
        run: |
          python tools/build_assets.py
          # Fails if the import changed or added files (stale .tres or missing .import).
          git status --porcelain game/
          test -z "$(git status --porcelain game/)"

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Cache Godot
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .tools/godot
          key: godot-${{ runner.os }}-${{ hashFiles('.godot-version', 'tools/godot-*.sha512') }}
      - name: Run gdUnit4 tests
        run: python tools/run_tests.py
      # The network test's WebRTC pass runs a local lobby.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Run host + client network test
        run: python tools/run_network_test.py

  network:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Cache Godot
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .tools/godot
          key: godot-${{ runner.os }}-${{ hashFiles('.godot-version', 'tools/godot-*.sha512') }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      # Starts a headless host and client over ENet on localhost, then over WebRTC through a
      # local lobby, plays scripted card events and exits non-zero on any per-wave state hash
      # mismatch.
      - name: Run host + client network test
        run: python tools/run_network_test.py

  lobby:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lobby
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun test
      - name: Build container
        run: docker build -t two-wards-lobby:${{ github.sha }} .

  # Exports run and upload on every push, so every branch has a downloadable
  # playtest build. Each platform exports on its own OS.
  export:
    name: export (${{ matrix.platform }})
    needs: [lint, test, test-windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            templates: ~/.local/share/godot/export_templates
          - platform: windows
            os: windows-latest
            templates: ~\AppData\Roaming\Godot\export_templates
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Cache Godot
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .tools/godot
          key: godot-${{ runner.os }}-${{ hashFiles('.godot-version', 'tools/godot-*.sha512') }}
      - name: Cache export templates
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ matrix.templates }}
          key: godot-templates-${{ runner.os }}-${{ hashFiles('.godot-version', 'tools/godot-*.sha512') }}
      - name: Export
        run: python tools/export.py ${{ matrix.platform }}
      - name: Upload build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: two-wards-${{ matrix.platform }}-${{ github.sha }}
          path: build/${{ matrix.platform }}/
          if-no-files-found: error

  # A pushed `v*` tag runs the whole pipeline above, then publishes the Windows build.
  release:
    needs: export
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: two-wards-windows-${{ github.sha }}
          path: two-wards-windows
      # Whole folder, not just the .exe: the pck is embedded but the webrtc-native DLL sits next to it.
      - run: zip -r "two-wards-windows-${{ github.ref_name }}.zip" two-wards-windows
      - run: gh release create "${{ github.ref_name }}" "two-wards-windows-${{ github.ref_name }}.zip" --repo "${{ github.repository }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
