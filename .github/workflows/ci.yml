name: CI

# Pipeline from docs/PLAN.md "Testing and CI":
#   1. Lint GDScript + asset validation   2. Unit and statistical tests
#   3. Headless network test              4. Lobby tests + container build
#   5. Windows + Linux exports (uploaded as artifacts on every push)
# Jobs for parts that don't exist yet (network test, lobby, asset validator)
# are gated on their entry point and switch on once it lands.

on:
  push:
  workflow_dispatch:

env:
  GDTOOLKIT_VERSION: 4.5.0

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      network: ${{ steps.check.outputs.network }}
      lobby: ${{ steps.check.outputs.lobby }}
      assets: ${{ steps.check.outputs.assets }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          has() { [ -e "$1" ] && echo true || echo false; }
          {
            echo "network=$(has tools/run_network_test.sh)"
            echo "lobby=$(has lobby/package.json)"
            echo "assets=$(has tools/validate_assets.py)"
          } | tee -a "$GITHUB_OUTPUT"

  lint:
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "gdtoolkit==${GDTOOLKIT_VERSION}"
      - run: gdlint game/scripts game/tests game/tools
      - run: gdformat --check game/scripts game/tests game/tools
      - name: Validate assets
        if: needs.detect.outputs.assets == 'true'
        run: |
          pip install -r tools/requirements.txt
          python -m unittest discover -s tools -p "test_*.py"
          python tools/validate_assets.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: .tools/godot
          key: godot-${{ runner.os }}-${{ hashFiles('.godot-version', 'tools/godot-*.sha512') }}
      - name: Run gdUnit4 tests
        run: ./tools/run_tests.sh
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdunit4-report
          path: game/reports/
          if-no-files-found: ignore
      - name: Check generated asset resources are up to date
        run: |
          ./tools/build_assets.sh
          # Fails if the import changed or added files (stale .tres or missing .import).
          git status --porcelain game/
          test -z "$(git status --porcelain game/)"

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: .tools/godot
          key: godot-${{ runner.os }}-${{ hashFiles('.godot-version', 'tools/godot-*.sha512') }}
      - name: Run gdUnit4 tests
        shell: pwsh
        run: ./tools/run_tests.ps1
      - name: Run host + client network test
        shell: pwsh
        run: ./tools/run_network_test.ps1

  network:
    needs: detect
    if: needs.detect.outputs.network == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: .tools/godot
          key: godot-${{ runner.os }}-${{ hashFiles('.godot-version', 'tools/godot-*.sha512') }}
      # Starts a headless host and client over ENet on localhost, plays scripted
      # card events and exits non-zero on any per-wave state hash mismatch.
      - name: Run host + client network test
        run: ./tools/run_network_test.sh

  lobby:
    needs: detect
    if: needs.detect.outputs.lobby == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lobby
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
      - name: Build container
        run: docker build -t two-wards-lobby:${{ github.sha }} .

  # Exports run and upload on every push, so every branch has a downloadable
  # playtest build. Each platform exports on its own OS so both the .sh and the
  # .ps1 export scripts stay exercised.
  export:
    name: export (${{ matrix.platform }})
    needs: [lint, test, test-windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            templates: ~/.local/share/godot/export_templates
          - platform: windows
            os: windows-latest
            templates: ~\AppData\Roaming\Godot\export_templates
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: .tools/godot
          key: godot-${{ runner.os }}-${{ hashFiles('.godot-version', 'tools/godot-*.sha512') }}
      - name: Cache export templates
        uses: actions/cache@v4
        with:
          path: ${{ matrix.templates }}
          key: godot-templates-${{ runner.os }}-${{ hashFiles('.godot-version', 'tools/godot-*.sha512') }}
      - name: Export (bash)
        if: runner.os != 'Windows'
        run: ./tools/export.sh ${{ matrix.platform }}
      - name: Export (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/export.ps1 ${{ matrix.platform }}
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: two-wards-${{ matrix.platform }}-${{ github.sha }}
          path: build/${{ matrix.platform }}/
          if-no-files-found: error
