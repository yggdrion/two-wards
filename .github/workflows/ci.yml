name: CI

# Pipeline from docs/PLAN.md "Testing and CI":
#   1. Lint GDScript + asset validation   2. Unit and statistical tests
#   3. Headless network test              4. Lobby tests + container build
#   5. Windows + Linux + macOS exports (uploaded as artifacts on every push)
#   6. GitHub Release with all three zips on `v*` tags
# Every job runs the same tools/*.py scripts as the local check (python tools/check.py).

on:
  push:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - run: gdlint game/scripts game/tests game/tools
      - run: gdformat --check game/scripts game/tests game/tools
      - name: Validate assets
        run: |
          python -m unittest discover -s tools -p "test_*.py"
          python tools/validate_assets.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Cache Godot
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/godot
          key: godot-${{ runner.os }}-${{ hashFiles('.godot-version', 'tools/godot-*.sha512') }}
      - name: Run gdUnit4 tests
        run: python tools/run_tests.py
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gdunit4-report
          path: game/reports/
          if-no-files-found: ignore
      - name: Check generated asset resources are up to date
        run: |
          python tools/build_assets.py
          # Fails if the import changed or added files (stale .tres or missing .import).
          git status --porcelain game/
          test -z "$(git status --porcelain game/)"

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Cache Godot
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/godot
          key: godot-${{ runner.os }}-${{ hashFiles('.godot-version', 'tools/godot-*.sha512') }}
      - name: Run gdUnit4 tests
        run: python tools/run_tests.py
      # The network test's WebRTC pass runs a local lobby.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Run host + client network test
        run: python tools/run_network_test.py

  network:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Cache Godot
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/godot
          key: godot-${{ runner.os }}-${{ hashFiles('.godot-version', 'tools/godot-*.sha512') }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # Starts a headless host and client over ENet on localhost, then over WebRTC through a
      # local lobby, plays scripted card events and exits non-zero on any per-wave state hash
      # mismatch.
      - name: Run host + client network test
        run: python tools/run_network_test.py

  lobby:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lobby
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun test
      - name: Build container
        run: docker build -t two-wards-lobby:${{ github.sha }} .

  # Exports run and upload on every push, so every branch has a downloadable
  # playtest build. Each platform exports on its own OS.
  export:
    name: export (${{ matrix.platform }})
    needs: [lint, test, test-windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            templates: ~/.local/share/godot/export_templates
          - platform: windows
            os: windows-latest
            templates: ~\AppData\Roaming\Godot\export_templates
          - platform: macos
            os: macos-latest
            templates: ~/Library/Application Support/Godot/export_templates
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Cache Godot
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/godot
          key: godot-${{ runner.os }}-${{ hashFiles('.godot-version', 'tools/godot-*.sha512') }}
      - name: Cache export templates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.templates }}
          # install.py holds the list of templates we extract.
          key: godot-templates-${{ runner.os }}-${{ hashFiles('.godot-version', 'tools/godot-*.sha512', 'tools/install.py') }}
      - name: Export
        run: python tools/export.py ${{ matrix.platform }}
      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: two-wards-${{ matrix.platform }}-${{ github.sha }}
          path: build/${{ matrix.platform }}/
          if-no-files-found: error

  # A pushed `v*` tag runs the whole pipeline above, then publishes all three builds.
  release:
    needs: export
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: two-wards-*-${{ github.sha }}
      # Whole folders, not just the binary: the pck is embedded but the webrtc-native library
      # sits next to it. macOS is already a zip with the .app (webrtc framework inside).
      - name: Package
        run: |
          tag="${{ github.ref_name }}"
          # Artifacts drop the exec bit; zip keeps it once restored.
          chmod +x "two-wards-linux-${{ github.sha }}/two-wards.x86_64"
          for p in linux windows; do
            mv "two-wards-$p-${{ github.sha }}" "two-wards-$p"
            zip -r "two-wards-$p-$tag.zip" "two-wards-$p"
          done
          mv "two-wards-macos-${{ github.sha }}/two-wards.zip" "two-wards-macos-$tag.zip"
      - run: >-
          gh release create "${{ github.ref_name }}" two-wards-*-"${{ github.ref_name }}".zip
          --repo "${{ github.repository }}" --generate-notes
          --notes "macOS: the app is not signed. After unzipping, run \`xattr -cr \"Two Wards.app\"\` once, then open it."
        env:
          GH_TOKEN: ${{ github.token }}
