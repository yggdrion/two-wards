name: CI

on:
  push:
  workflow_dispatch:

env:
  GDTOOLKIT_VERSION: 4.5.0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "gdtoolkit==${GDTOOLKIT_VERSION}"
      - run: gdlint game/scripts game/tests
      - run: gdformat --check game/scripts game/tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: .tools/godot
          key: godot-${{ runner.os }}-${{ hashFiles('.godot-version', 'tools/godot-*.sha512') }}
      - name: Run gdUnit4 tests
        run: ./tools/run_tests.sh
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdunit4-report
          path: game/reports/
          if-no-files-found: ignore

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: .tools/godot
          key: godot-${{ runner.os }}-${{ hashFiles('.godot-version', 'tools/godot-*.sha512') }}
      - name: Run gdUnit4 tests
        shell: pwsh
        run: ./tools/run_tests.ps1
