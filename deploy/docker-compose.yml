# Lobby and coturn on the gvm host (grafana.r4b2.de), next to its Caddy, VictoriaMetrics and
# Grafana. Both join gvm's network, so Caddy proxies the lobby by name and vector scrapes both
# metrics endpoints without publishing them. Setup and updates: deploy/README.md.
name: two-wards

services:
  lobby:
    image: ghcr.io/yggdrion/two-wards-lobby:${LOBBY_TAG:-latest}
    container_name: two-wards-lobby
    environment:
      TURN_HOST: twowards.r4b2.de
      TURN_SECRET: ${TURN_SECRET:?set TURN_SECRET in .env}
    restart: unless-stopped
    networks: [gvm]

  coturn:
    image: coturn/coturn:4.18.0
    container_name: two-wards-coturn
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --static-auth-secret=${TURN_SECRET:?set TURN_SECRET in .env}
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      # Relay range; must match min-port/max-port in turnserver.conf.
      - "49160-49200:49160-49200/udp"
    restart: unless-stopped
    networks: [gvm]

networks:
  gvm:
    name: gvm_default
    external: true
