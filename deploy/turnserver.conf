# coturn for Two Wards: STUN plus a TURN relay for peers that can't connect directly.
# Credentials are time-limited and minted by the lobby (coturn REST API scheme); the shared
# secret comes from TURN_SECRET via --static-auth-secret in docker-compose.yml.
listening-port=3478
min-port=49160
max-port=49200
# The container sits behind Docker's NAT; advertise the host's public address.
external-ip=91.99.227.111
realm=twowards.r4b2.de
use-auth-secret
fingerprint
no-tls
no-dtls
no-cli
no-multicast-peers
# Metrics on :9641 inside gvm_default only (scraped by vector, not published).
prometheus
# Two players per room; this caps relayed sessions on the small box.
total-quota=50
# Never relay into private or local networks (the host's Docker network included).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
log-file=stdout
